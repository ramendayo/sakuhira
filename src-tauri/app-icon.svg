<!-- アプリアイコンの元画像。macOSの規格に合わせ、周囲に100pxの余白を持つ角丸の四角に、二枚の桜の花びらで作った S を置いている。
     S の形と色は src/components/SakuraMark.tsx（サイドバーのロゴ）のダーク配色と同じ。形を変えたら両方を揃えること。
     再生成: npx tauri icon src-tauri/app-icon.svg -o <一時ディレクトリ> を実行し、src-tauri/icons にある既存のファイルと同名のものだけをコピーする（iOS・Android用は不要）。 -->
